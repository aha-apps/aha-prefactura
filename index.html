<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0891b2">
  <meta name="description" content="Prefacturación offline para freelancers. Genera facturas con folio automático, exporta PDF, control de clientes con RFC.">
  <title>AHA PreFactura</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  <style>
    /* Skeleton shimmer */
    .sk-el { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.5rem; }
    .sk-heading { height: 1.75rem; width: 60%; margin-bottom: 1rem; }
    .sk-card { height: 8rem; width: 100%; margin-bottom: 1rem; }
    .sk-row { height: 3rem; width: 100%; margin-bottom: 0.5rem; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Layout */
    body { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .sidebar-transition { transition: transform 0.3s ease, width 0.3s ease; }

    /* Nav module active */
    .nav-module.active {
      background-color: rgba(8,145,178,0.1);
      color: #0891b2;
      border-right: 3px solid #0891b2;
    }
    .nav-module.active i { color: #0891b2; }

    /* x-cloak */
    [x-cloak] { display: none !important; }

    /* Module content fade in */
    .module-enter { animation: fadeInUp 0.3s ease; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    @media (max-width: 767px) {
      .sidebar-desktop { display: none; }
      .sidebar-mobile { display: block; }
    }
    @media (min-width: 768px) {
      .sidebar-desktop { display: block; }
      .sidebar-mobile { display: none; }
    }

    /* Invoice preview */
    .invoice-preview { font-family: "Courier New", monospace; }
  </style>
</head>
<body class="min-h-screen bg-base-200">
  <div x-data="appShell()" x-init="initShell()" class="min-h-screen flex flex-col">

    <!-- Mobile Navbar -->
    <div class="md:hidden bg-base-100 border-b border-base-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <button id="menu-toggle" class="btn btn-ghost btn-sm btn-square">
          <i class="bi bi-list text-xl"></i>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white font-bold text-sm">PF</div>
          <span class="font-bold text-sm">PreFactura</span>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <span x-show="$store.network.online === false" class="badge badge-error badge-sm gap-1 animate__animated animate__fadeIn">
          <i class="bi bi-wifi-off"></i>
        </span>
        <button class="btn btn-ghost btn-sm btn-square" @click="$dispatch('open-palette')">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar Desktop -->
      <aside id="sidebar" class="sidebar-desktop sidebar-transition w-64 bg-base-100 border-r border-base-200 flex flex-col shrink-0">
        <!-- Brand -->
        <div class="p-5 border-b border-base-200">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white font-bold">PF</div>
            <div>
              <h1 class="font-bold text-base">AHA PreFactura</h1>
              <p class="text-xs text-base-content/50">Plan Lite</p>
            </div>
          </div>
        </div>

        <!-- Nav Modules -->
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
          <template x-for="mod in modules" :key="mod.id">
            <a :href="'#' + mod.id"
               class="nav-module flex items-center gap-3 px-4 py-2.5 rounded-lg text-base-content/70 hover:bg-base-200 transition-colors text-sm"
               :class="{ 'active': currentModule === mod.id }"
               :data-module="mod.id">
              <i :class="mod.icono" class="text-lg w-6 text-center"></i>
              <span x-text="mod.titulo"></span>
            </a>
          </template>
        </nav>

        <!-- Bottom actions -->
        <div class="p-3 border-t border-base-200 space-y-1">
          <button class="btn btn-ghost btn-sm w-full justify-start gap-3 text-sm" onclick="SyncEngine.exportar('')">
            <i class="bi bi-download text-lg"></i> Exportar datos
          </button>
          <button class="btn btn-ghost btn-sm w-full justify-start gap-3 text-sm" onclick="document.getElementById('import-file').click()">
            <i class="bi bi-upload text-lg"></i> Importar datos
          </button>
          <input type="file" id="import-file" accept=".ateje-backup" class="hidden" onchange="SyncEngine.importar(this.files[0], '')">
        </div>
      </aside>

      <!-- Sidebar Mobile (overlay) -->
      <aside id="sidebar-mobile" class="sidebar-mobile fixed inset-0 z-40 pointer-events-none">
        <div class="absolute inset-0 bg-base-300/60 backdrop-blur-sm opacity-0 transition-opacity pointer-events-none" id="sidebar-overlay"></div>
        <div id="sidebar-panel" class="absolute left-0 top-0 bottom-0 w-72 bg-base-100 border-r border-base-200 flex flex-col -translate-x-full transition-transform sidebar-transition shadow-2xl">
          <div class="p-5 border-b border-base-200 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white font-bold">PF</div>
              <div>
                <h1 class="font-bold text-base">PreFactura</h1>
                <p class="text-xs text-base-content/50">Plan Lite</p>
              </div>
            </div>
            <button id="menu-close" class="btn btn-ghost btn-sm btn-square">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
          <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
            <template x-for="mod in modules" :key="mod.id">
              <a :href="'#' + mod.id"
                 class="nav-module flex items-center gap-3 px-4 py-2.5 rounded-lg text-base-content/70 hover:bg-base-200 transition-colors text-sm"
                 :class="{ 'active': currentModule === mod.id }"
                 :data-module="mod.id">
                <i :class="mod.icono" class="text-lg w-6 text-center"></i>
                <span x-text="mod.titulo"></span>
              </a>
            </template>
          </nav>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
        <div id="module-container" class="module-enter max-w-5xl mx-auto">
          <!-- Skeleton loading -->
          <div id="module-skeleton" class="space-y-4 animate__animated animate__fadeIn">
            <div class="sk-el sk-heading"></div>
            <div class="sk-el sk-card"></div>
            <div class="sk-el sk-row"></div>
            <div class="sk-el sk-row"></div>
            <div class="sk-el sk-row"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Search Palette (Cmd+K) -->
    <div x-data="window.searchPalette"
         @keydown.window.cmd.k.prevent="openPalette()"
         @keydown.window.ctrl.k.prevent="openPalette()"
         @open-palette.window="openPalette()"
         @keydown.window="onKeydown($event)">
      <template x-teleport="body">
        <div x-show="open" x-cloak class="fixed inset-0 z-[60] flex items-start justify-center pt-[12vh]"
             @click.away="closePalette">
          <div class="absolute inset-0 bg-base-300/60 backdrop-blur-sm"></div>
          <div class="relative w-full max-w-xl">
            <div class="bg-base-100 rounded-2xl shadow-2xl border border-base-300 overflow-hidden">
              <div class="flex items-center gap-3 px-5 py-4 border-b border-base-200">
                <i class="bi bi-search text-base-content/40"></i>
                <input x-model="query" @input="filtered = (query.length < 2) ? modules.slice(0) : modules.filter(m => m.title.toLowerCase().indexOf(query.toLowerCase()) !== -1 || m.id.toLowerCase().indexOf(query.toLowerCase()) !== -1)" type="text" class="sp-search-input flex-1 bg-transparent border-0 outline-none text-base placeholder:text-base-content/30" placeholder="Buscar m\u00f3dulos...">
                <kbd class="hidden sm:inline-flex px-2 py-0.5 text-xs rounded bg-base-200 text-base-content/50">ESC</kbd>
              </div>
              <div class="max-h-80 overflow-y-auto p-2">
                <template x-if="!query">
                  <div class="px-3 py-2 text-xs font-semibold text-base-content/40 uppercase tracking-wider">M\u00f3dulos</div>
                </template>
                <template x-if="query.length >= 2 && filtered.length === 0">
                  <div class="px-3 py-8 text-center text-sm text-base-content/40">
                    <i class="bi bi-emoji-frown text-4xl block mb-2 opacity-40"></i>
                    Sin resultados para "<span x-text="query"></span>"
                  </div>
                </template>
                <template x-for="(item, i) in filtered" :key="i">
                  <div @click="selectItem(item)" @mouseenter="keyboardNav = false"
                       :class="{'bg-primary/10 text-primary': keyboardNav && i === selectedIdx, 'hover:bg-base-200': !(keyboardNav && i === selectedIdx)}"
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer transition-colors">
                    <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-base-200 text-base-content/60 shrink-0">
                      <i :class="'bi ' + item.icon" class="text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm font-medium truncate" x-text="item.title"></div>
                    </div>
                    <span class="badge badge-ghost badge-sm">m\u00f3dulo</span>
                  </div>
                </template>
              </div>
              <div class="flex items-center gap-4 px-5 py-2.5 border-t border-base-200 text-xs text-base-content/40">
                <span class="flex items-center gap-1"><kbd class="kbd kbd-xs">\u2191\u2193</kbd> Navegar</span>
                <span class="flex items-center gap-1"><kbd class="kbd kbd-xs">\u21b5</kbd> Abrir</span>
                <span class="flex items-center gap-1"><kbd class="kbd kbd-xs">Esc</kbd> Cerrar</span>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Alpine Store (loading + network) -->
  <script>
    document.addEventListener('alpine:init', function() {
      Alpine.store('loading', { phase: false, visible: false });
      Alpine.store('network', { online: navigator.onLine });
    });
  </script>

  <!-- JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.6/dist/dexie.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

  <!-- Core Scripts -->
  <script src="core/env.js"></script>
  <script src="core/db.js"></script>
  <script src="core/crypto.js"></script>
  <script src="core/ui.js"></script>
  <script src="core/theme.js"></script>
  <script src="core/network.js"></script>
  <script src="core/file-store.js"></script>
  <script src="core/sync.js"></script>
  <script src="core/license.js"></script>
  <script src="core/seed.js"></script>
  <script src="core/search-palette.js"></script>
  <script src="core/app.js"></script>
  <script src="core/main.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(err) {
        console.log('SW registration skipped:', err.message);
      });
    }
  </script>

  <script>
    // App shell Alpine component
    function appShell() {
      return {
        modules: [],
        currentModule: 'clientes_fiscales',
        initShell: function() {
          var self = this;
          // Build module list from APP_CONFIG
          if (APP_CONFIG && APP_CONFIG.modulos) {
            for (var key in APP_CONFIG.modulos) {
              if (APP_CONFIG.modulos.hasOwnProperty(key) && APP_CONFIG.modulos[key].activo) {
                self.modules.push({
                  id: key,
                  titulo: APP_CONFIG.modulos[key].titulo || key,
                  icono: APP_CONFIG.modulos[key].icono || 'bi bi-folder'
                });
              }
            }
          }
          // Listen for hash changes to update active module
          window.addEventListener('hashchange', function() {
            var hash = window.location.hash.replace('#', '') || 'clientes_fiscales';
            self.currentModule = hash;
            // Close mobile sidebar
            var panel = document.getElementById('sidebar-panel');
            var overlay = document.getElementById('sidebar-overlay');
            if (panel && overlay) {
              panel.classList.add('-translate-x-full');
              overlay.classList.remove('opacity-100');
              overlay.classList.add('opacity-0');
              document.getElementById('sidebar-mobile').classList.add('pointer-events-none');
            }
          });
          // Mobile menu toggle
          setTimeout(function() {
            var menuBtn = document.getElementById('menu-toggle');
            var closeBtn = document.getElementById('menu-close');
            var panel = document.getElementById('sidebar-panel');
            var overlay = document.getElementById('sidebar-overlay');
            var mobileSidebar = document.getElementById('sidebar-mobile');
            if (menuBtn && panel && overlay && mobileSidebar) {
              menuBtn.onclick = function() {
                mobileSidebar.classList.remove('pointer-events-none');
                panel.classList.remove('-translate-x-full');
                overlay.classList.remove('opacity-0');
                overlay.classList.add('opacity-100');
              };
              if (closeBtn) {
                closeBtn.onclick = function() {
                  panel.classList.add('-translate-x-full');
                  overlay.classList.remove('opacity-100');
                  overlay.classList.add('opacity-0');
                  setTimeout(function() { mobileSidebar.classList.add('pointer-events-none'); }, 300);
                };
              }
              overlay.onclick = function() {
                panel.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                setTimeout(function() { mobileSidebar.classList.add('pointer-events-none'); }, 300);
              };
            }
          }, 500);
        }
      };
    }
  </script>
</body>
</html>
